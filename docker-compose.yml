# Saakh — three services, one network, two named volumes.
#
# Topology is the one specified in tech-stack.md: an nginx-served Angular build,
# the ASP.NET Core API, and SQL Server. Secrets come from a git-ignored .env and
# are never baked into an image. The same file runs unchanged on a laptop or on
# an Oracle Cloud Always Free VM.
#
#   docker compose up -d --build
#   docker compose exec api dotnet Saakh.Api.dll --seed
#
# The schema is applied by the API on boot here (Database__MigrateOnStartup below).
# For a deployment running more than one replica, turn that off and apply it once
# with the bundle instead:
#
#   docker compose exec api sh -c './migrate --connection "$ConnectionStrings__Default"'

services:
  web:
    build: ./frontend # Angular build, served by nginx
    ports: ['80:80']
    environment:
      # nginx proxies /api and /hubs here. The service name and its own port work
      # on a compose network; hosts that put internal apps behind ingress on 80
      # (Azure Container Apps) need just the name. See frontend/nginx.conf.template.
      - API_UPSTREAM=${API_UPSTREAM:-api:5000}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  api:
    build: ./backend # ASP.NET Core Web API
    ports: ['5000:5000']
    environment:
      - ConnectionStrings__Default=Server=db;Database=Saakh;User=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True
      - Gstin__ApiKey=${GSTIN_API_KEY:-}
      # Mock by default so a demo never spends a real gstinapi.in credit. Set to
      # GstinApi, with a key above, for the live registry lookup.
      - Gstin__Provider=${GSTIN_PROVIDER:-Mock}
      - Jwt__Key=${JWT_KEY}
      - Email__Provider=${EMAIL_PROVIDER:-Log}
      - Email__SendGridApiKey=${SENDGRID_API_KEY:-}
      - Email__SmtpHost=${SMTP_HOST:-}
      - Email__SmtpPort=${SMTP_PORT:-2525}
      - Email__SmtpUser=${SMTP_USER:-}
      - Email__SmtpPassword=${SMTP_PASSWORD:-}
      - Email__FromAddress=${EMAIL_FROM:-no-reply@saakh.app}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      # There is no SMS gateway in the free stack, so the signup code is returned in
      # the API response and filled into the form. This is a demo stack — it also
      # seeds accounts that share one password. Set REVEAL_OTP=false for anything
      # real: with it on, anyone can confirm any phone number.
      - Otp__RevealCodeInResponse=${REVEAL_OTP:-true}
      # How the signup code reaches the user. "Log" delivers nothing — it is what makes
      # a fresh clone demoable, and it is why the step verifies nothing until this is
      # set. "Email" sends it to the signup address, which is the only real delivery
      # that is free in India, where SMS is DLT-regulated and every gateway gates its
      # API behind payment. Fast2Sms, Msg91 and Twilio put it on the handset. Any real
      # channel automatically stops the code being returned to the form.
      - Sms__Provider=${SMS_PROVIDER:-Log}
      - Sms__ApiKey=${SMS_API_KEY:-}
      - Sms__TemplateId=${SMS_TEMPLATE_ID:-}
      - Sms__AccountSid=${SMS_ACCOUNT_SID:-}
      - Sms__FromNumber=${SMS_FROM_NUMBER:-}
      # One replica, so the API can safely bring its own schema up to date and the
      # stack comes up from cold with no second command. Set to false where more
      # than one instance runs, and apply the migrate bundle once instead — two
      # instances migrating the same database concurrently is not safe.
      - Database__MigrateOnStartup=${MIGRATE_ON_STARTUP:-true}
      # Hangfire polls its storage every QueuePollIntervalSeconds whether or not
      # there is work, so an idle API still keeps the database awake. That is free
      # against a container, and expensive against a database metered by
      # time-online — on Azure SQL's free offer the poll alone spends the monthly
      # allowance in about two days. Off, the overdue-settlement closure, the
      # suspension expiry and the GSTIN retry do not run. See deploy/azure/README.md.
      - Jobs__Enabled=${JOBS_ENABLED:-true}
      - Jobs__QueuePollIntervalSeconds=${JOBS_POLL_SECONDS:-15}
      # The web container proxies the browser to the API on its own origin, so
      # this only matters when the API is called directly on port 5000.
      - Cors__Origins__0=${WEB_ORIGIN:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evidence-docs:/app/storage/evidence
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    volumes:
      - sql-data:/var/opt/mssql
    # The API's migration step fails against a database that is still starting,
    # so the API waits for SQL Server to actually accept a login.
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -No -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

volumes:
  sql-data:
  evidence-docs:
