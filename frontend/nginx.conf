# nginx config for the Angular container.
#
# The SPA and the API are served from one origin: nginx reverse-proxies /api and
# /hubs to the api service inside the compose network. That keeps the browser on
# a single origin, so there is no CORS preflight and no API hostname baked into
# the JavaScript bundle at build time.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vendors are often on patchy mobile data, so text assets are compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build output never changes under the same name, so it is immutable.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Evidence uploads are up to 10 MB each.
        client_max_body_size 40m;
        proxy_read_timeout 120s;
    }

    # SignalR needs the connection upgraded for WebSocket transport.
    location /hubs/ {
        proxy_pass http://api:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A long read timeout keeps an idle hub connection from being dropped.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /swagger/ {
        proxy_pass http://api:5000/swagger/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:5000/health;
        proxy_set_header Host $host;
    }

    # Every other path is an Angular route, so it falls through to the shell.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
